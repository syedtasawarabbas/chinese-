function mark(syl,t){
  if(!(t>=1&&t<=4))return syl;
  var low=syl.toLowerCase(),idx=-1;
  if(low.indexOf('a')>-1)idx=low.indexOf('a');
  else if(low.indexOf('e')>-1)idx=low.indexOf('e');
  else if(low.indexOf('ou')>-1)idx=low.indexOf('o');

  var rep=TM[low[idx]][t-1],orig=syl[idx];
  if(orig!==orig.toLowerCase())rep=rep.toUpperCase();
  return syl.slice(0,idx)+rep+syl.slice(idx+1);
}

function glossOf(tok){var k=bare(tok);if(!k)return null;if(GLOSS[k])return GLOSS[k];

/* ---------- find a real example sentence for a vocabulary word (slide/photo only, never invented lines) ---------- */
function findExample(lecture,pinyinWord){
  var key=bare(pinyinWord);
  if(!key)return null;
  var pool=SEN.filter(function(s){return s[3]==="s"||s[3]==="n"});
  var sameLec=pool.filter(function(s){return s[0]===lecture});
  var rest=pool.filter(function(s){return s[0]!==lecture});
  function hit(list){return list.filter(function(s){return bare(s[1]).indexOf(key)>-1})[0]}
  return hit(sameLec)||hit(rest)||null;
}

function chipRow(sel,on,lecs){
  var list=lecs||LECS;
  var d=document.createElement("div");d.className="chips";
  var all=document.createElement("button");all.className="chip";all.textContent="All";all.setAttribute("aria-pressed",sel.size===list.length);
  all.onclick=function(){list.forEach(function(l){sel.add(l)});on()};d.appendChild(all);
  list.forEach(function(l){var b=document.createElement("button");b.className="chip";b.textContent=lecShort(l);b.title=lecLabel(l);
    b.setAttribute("aria-pressed",sel.has(l));
    b.onclick=function(){if(sel.has(l)){if(sel.size>1)sel.delete(l)}else sel.add(l);on()};d.appendChild(b)});
  return d;
}
function deck(v,cfg){
  var lecs=cfg.lecs||[4,5,6,7,8,9,10];

  var panel=document.createElement("div");panel.className="panel";v.appendChild(panel);
  function pool(){return cfg.items().filter(function(x){return sel.has(x[0])})}
  function restart(list){st.q=shuffle((list||pool()).slice());st.i=0;st.shown=false;st.ok=0;st.miss=[];draw()}
  function draw(){
    panel.innerHTML="";
    var p=document.createElement("p");p.className="hint";p.textContent=cfg.title;panel.appendChild(p);
    panel.appendChild(chipRow(sel,function(){restart()},lecs));
    var it=st.q[st.i];
    var stats=document.createElement("div");stats.className="stats";
    stats.innerHTML='<span>Card '+Math.min(st.i+1,st.q.length)+' of '+st.q.length+'</span><span>Knew '+st.ok+'</span><span>Missed '+st.miss.length+'</span>';
    panel.appendChild(stats);
    if(!it){
      var d=document.createElement("div");d.className="done";
      d.innerHTML='<div class="big">'+st.ok+' / '+st.q.length+'</div><p class="hint">Cards you knew.</p>';
      var r=document.createElement("div");r.className="row";r.style.justifyContent="center";
      if(st.miss.length){var b1=document.createElement("button");b1.className="btn primary";b1.textContent="Practise the "+st.miss.length+" missed";b1.onclick=function(){restart(st.miss.slice())};r.appendChild(b1)}
      var b2=document.createElement("button");b2.className="btn";b2.textContent="Start again";b2.onclick=function(){restart()};r.appendChild(b2);
      d.appendChild(r);panel.appendChild(d);return}
    var c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="tag">'+lecLabel(it[0])+(it[3]?flagBadge(it[3]):"")+'</div>'+cfg.front(it);
    if(st.shown){var a=document.createElement("div");a.className="ans";a.innerHTML=cfg.back(it)+(it[4]?'<div class="note">'+it[4]+'</div>':"");c.appendChild(a)}
    panel.appendChild(c);
    var row=document.createElement("div");row.className="row";
    if(!st.shown){var s=document.createElement("button");s.className="btn primary";s.textContent="Show answer";s.onclick=function(){st.shown=true;draw()};row.appendChild(s)}
    else{
      var k=document.createElement("button");k.className="btn ok";k.textContent="Knew it";k.onclick=function(){st.ok++;st.i++;st.shown=false;draw()};
      var m=document.createElement("button");m.className="btn bad";m.textContent="Missed it";m.onclick=function(){st.miss.push(it);st.i++;st.shown=false;draw()};
      row.appendChild(k);row.appendChild(m)}
    panel.appendChild(row);
  }
  restart();
}

/* ---------- Q3 vocabulary ---------- */
function vocab(v){
  var rev=false;
  var wrapper=document.createElement("div");v.appendChild(wrapper);
  function build(){
    wrapper.innerHTML="";
    var t=document.createElement("label");t.className="toggle";
    t.innerHTML='<input type="checkbox" id="rev"'+(rev?" checked":"")+'> Reverse the cards (English to pinyin)';
    wrapper.appendChild(t);
    var holder=document.createElement("div");wrapper.appendChild(holder);
    deck(holder,{lecs:[4,5,6,7,8,9,10],items:function(){return VOC.map(function(r){return [r[0],r[1],r[2],r[3]]})},
      front:function(i){return rev?'<div class="en">'+i[2]+'</div>':'<div class="py">'+marked(i[1])+'</div>'},
      back:function(i){return rev?'<div class="py">'+marked(i[1])+'</div>':'<div class="en">'+i[2]+'</div>'},
      title:"Say the meaning before you reveal it. Cards tagged “Reference” were not legible in your materials."});
    document.getElementById("rev").onchange=function(e){rev=e.target.checked;build()};
  }
  build();
}

/* ---------- Q4 missing tones ---------- */
function quiz(v){
  var sel=new Set([4,5,6,7,8,9,10,"x"]),mode="words";
  var st={q:[],i:0,vals:[],checked:false,right:0,total:0};
  var panel=document.createElement("div");panel.className="panel";v.appendChild(panel);
  function source(){return mode==="words"?VOC.filter(function(r){return sel.has(r[0])&&r[3]!=="r"&&r[1].replace(/[^1-5]/g,"").length>0}):SEN.filter(function(r){return sel.has(r[0])})}
  function next(first){
    if(first||st.i>=st.q.length-1){st.q=shuffle(source().slice());st.i=0}else st.i++;
    var it=st.q[st.i];st.vals=parse(it[1]).map(function(t){return 0});st.checked=false;draw()}
  function draw(){
    panel.innerHTML="";
    var p=document.createElement("p");p.className="hint";p.textContent="Click a syllable to cycle its tone: 1, 2, 3, 4, then neutral (shown with a dot), then blank. Press Check once every syllable is set.";panel.appendChild(p);
    var m=document.createElement("div");m.className="chips";
    ["words","sentences"].forEach(function(k){var b=document.createElement("button");b.className="chip";b.textContent=k==="words"?"Words":"Sentences";b.setAttribute("aria-pressed",mode===k);b.onclick=function(){mode=k;next(true)};m.appendChild(b)});
    panel.appendChild(m);
    panel.appendChild(chipRow(sel,function(){next(true)},[4,5,6,7,8,9,10,"x"]));
    var it=st.q[st.i];
    if(!it){panel.innerHTML+='<p class="hint">No items match this filter.</p>';return}
    var stats=document.createElement("div");stats.className="stats";stats.innerHTML='<span>Syllables right '+st.right+' of '+st.total+'</span>';panel.appendChild(stats);
    var c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="tag">'+lecLabel(it[0])+(it[3]?flagBadge(it[3]):"")+'</div>';
    var toks=document.createElement("div");toks.className="toks";
    var toksList=parse(it[1]),si=0,first=true;
    toksList.forEach(function(t){
      if(!t.s){var x=document.createElement("span");x.className="x";x.textContent=(first&&mode==="sentences")?cap(t.w):t.w;first=false;toks.appendChild(x);return}
      var idx=si++,b=document.createElement("button");b.className="syl";
      var w=(first&&mode==="sentences")?cap(t.w):t.w;first=false;
      var s=st.vals[idx];
      b.textContent=(s>=1&&s<=4)?mark(w,s):(s===5?w+"·":w);
      if(s)b.classList.add("set");
      if(st.checked){b.classList.add(s===t.n?"right":"wrong");b.disabled=true}
      b.onclick=function(){st.vals[idx]=(s+1)%6;draw()};
      toks.appendChild(b)});
    c.appendChild(toks);
    var en=document.createElement("div");en.className="en";en.style.fontSize="1rem";en.style.color="var(--muted)";en.textContent=it[2];c.appendChild(en);
    if(st.checked){var a=document.createElement("div");a.className="ans";a.innerHTML='<div class="py">'+(mode==="sentences"?cap(marked(it[1])):marked(it[1]))+'</div>'+(it[4]?'<div class="note">'+it[4]+'</div>':"");c.appendChild(a)}
    panel.appendChild(c);
    var row=document.createElement("div");row.className="row";
    if(!st.checked){
      var ck=document.createElement("button");ck.className="btn primary";ck.textContent="Check";
      ck.onclick=function(){var si2=0;parse(it[1]).forEach(function(t){if(t.s){st.total++;if(st.vals[si2]===t.n)st.right++;si2++}});st.checked=true;draw()};
      row.appendChild(ck)}
    var nx=document.createElement("button");nx.className="btn"+(st.checked?" primary":"");nx.textContent=st.checked?"Next":"Skip";nx.onclick=function(){next(false)};row.appendChild(nx);
    panel.appendChild(row);
  }
  next(true);
}
